<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agent Todo</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main id="agent-todo-app" class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">AGENT TODO</p>
          <h1>Session checklist</h1>
        </div>
        <label class="session-picker">Session
          <select id="session-select" aria-label="Session"></select>
        </label>
      </header>
      <section class="status-row" aria-live="polite">
        <span id="connection-status" class="status-dot">Connecting</span>
        <span id="completion-summary">0 of 0 complete</span>
      </section>
      <section class="todo-section">
        <div class="section-heading"><h2>Todo list</h2><button id="clear-button" type="button">Clear</button></div>
      <ul id="todo-list" class="todo-list"></ul>
      <p id="empty-state" class="empty-state">No todos yet.</p>
      <template id="todo-status-options"><option value="pending">Pending</option><option value="in_progress">In progress</option><option value="completed">Completed</option></template>
      </section>
      <form id="add-form" class="add-form">
        <label for="add-input">Add a todo</label>
        <div class="form-row"><input id="add-input" required autocomplete="off"><button type="submit">Add</button></div>
      </form>
      <p id="notice" class="notice" role="status"></p>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
