<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" role="img" aria-labelledby="title desc">
  <title id="title">Terminal UI theming and task controls</title>
  <desc id="desc">The TUI offers a first-run theme dialog with 19 palettes, theme-driven syntax highlighting, an effort picker, layout modes and a performance monitor.</desc>
  <rect width="880" height="320" fill="#f7faf9"/>
  <text x="24" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#17333b">Terminal UI: themes and task controls</text>
  <text x="24" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#55707a">Gemini-inspired presentation layered on the shared Ink/React client.</text>

  <!-- Theme dialog mock -->
  <rect x="24" y="82" width="300" height="200" rx="10" fill="#17333b" stroke="#17333b"/>
  <text x="44" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">/theme — select a palette</text>
  <line x1="44" y1="118" x2="304" y2="118" stroke="#3d5a60" stroke-width="1"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="11.5">
    <rect x="40" y="128" width="268" height="26" rx="5" fill="#2f6b64"/>
    <text x="52" y="145" fill="#ffffff">➜  Oceanic   live highlight preview</text>
    <text x="52" y="172" fill="#cfe3de">   Dracula</text>
    <text x="52" y="196" fill="#cfe3de">   GitHub Dark</text>
    <text x="52" y="220" fill="#cfe3de">   Solarized Light</text>
    <text x="52" y="244" fill="#cfe3de">   … 15 more ported palettes</text>
    <text x="52" y="270" fill="#9fc9bf">Enter apply · Esc cancel · ↑↓ move</text>
  </g>

  <!-- highlight sample -->
  <rect x="346" y="82" width="248" height="96" rx="10" fill="#ffffff" stroke="#b3c7e1"/>
  <text x="362" y="105" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#315f91">Syntax highlighting</text>
  <g font-family="Consolas, Menlo, monospace" font-size="11.5">
    <text x="362" y="128" fill="#8d6a14">const</text><text x="404" y="128" fill="#17333b"> agent = </text><text x="474" y="128" fill="#165d59">createAgent</text><text x="554" y="128" fill="#17333b">();</text>
    <text x="362" y="148" fill="#a8542d">await</text><text x="408" y="148" fill="#17333b"> agent.</text><text x="464" y="148" fill="#315f91">run</text><text x="490" y="148" fill="#17333b">(prompt);</text>
  </g>
  <text x="362" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#55707a">theme-driven tokens, zero dependencies</text>

  <!-- controls -->
  <rect x="346" y="192" width="248" height="90" rx="10" fill="#e9eff8" stroke="#b0c5e4"/>
  <text x="362" y="215" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#315f91">Effort · Layout · Perf</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#315f91">
    <text x="362" y="237">/effort slider (off → max)</text>
    <text x="362" y="256">document / inline scrollback</text>
    <text x="362" y="275">Ctrl+L clear · perf monitor</text>
  </g>

  <!-- document flow -->
  <rect x="616" y="82" width="240" height="200" rx="10" fill="#fff0df" stroke="#e7c29a"/>
  <text x="634" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#a8542d">Document flow</text>
  <line x1="634" y1="118" x2="836" y2="118" stroke="#e7c29a" stroke-width="1"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#6b4633">
    <text x="634" y="142">❯ Summarize the repo</text>
    <text x="634" y="166">● reading src/loop.ts</text>
    <text x="634" y="184">✓ validated tool call</text>
    <text x="634" y="202">● 12s thinking…</text>
    <text x="634" y="226">The runtime shares one core…</text>
    <text x="634" y="244">across CLI, TUI and Web.</text>
    <text x="634" y="270" fill="#a8542d">❯ _</text>
  </g>
</svg>
